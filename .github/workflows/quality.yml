name: autoresearch-quality

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/quality.yml"
  push:
    branches: ["main", "master", "autoresearch/apr"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff requests

      - name: Lint (syntax and undefined-name safety)
        run: ruff check . --select E9,F63,F7,F82

      - name: Run smoke test suite
        run: pytest -q
